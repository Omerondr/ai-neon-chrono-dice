<!DOCTYPE html>
<html lang="tr" class="h-full bg-[#050508]">
<head>
    <meta charset="UTF-8">
    <title>NEON CHRONO DICE // Cyber-Utility</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body { background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 6px 100%; }
        .dice-container { perspective: 600px; width: 120px; height: 120px; }
        .dice { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1.15); }
        .dice-face { position: absolute; width: 120px; height: 120px; background: rgba(12, 12, 20, 0.95); border: 2px solid #DF00FF; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 3rem; color: #DF00FF; border-radius: 12px; backface-visibility: hidden; }
        .face-1 { transform: rotateY(0deg) translateZ(60px); } .face-6 { transform: rotateY(180deg) translateZ(60px); } .face-3 { transform: rotateY(90deg) translateZ(60px); } .face-4 { transform: rotateY(-90deg) translateZ(60px); } .face-2 { transform: rotateX(90deg) translateZ(60px); } .face-5 { transform: rotateX(-90deg) translateZ(60px); }
    </style>
</head>
<body class="text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-[#0c0c14] p-8 rounded-2xl border border-gray-800 shadow-[0_0_30px_rgba(0,0,0,0.5)]">
        <h1 class="text-neonGreen text-center font-orbitron font-black mb-6 tracking-widest">NEON CHRONO</h1>
        <div id="chrono" class="text-center font-mono text-5xl mb-6 text-green-400">00:00.00</div>
        <div class="flex gap-2 mb-8">
            <button onclick="start()" class="flex-1 py-2 border border-green-500 text-green-500 hover:bg-green-500/20">START</button>
            <button onclick="stop()" class="flex-1 py-2 border border-yellow-500 text-yellow-500 hover:bg-yellow-500/20">STOP</button>
            <button onclick="reset()" class="flex-1 py-2 border border-red-500 text-red-400 hover:bg-red-500/20">RESET</button>
        </div>
        <div class="flex justify-center mb-6">
            <div class="dice-container"><div id="dice" class="dice"><div class="dice-face face-1">1</div><div class="dice-face face-2">2</div><div class="dice-face face-3">3</div><div class="dice-face face-4">4</div><div class="dice-face face-5">5</div><div class="dice-face face-6">6</div></div></div>
        </div>
        <button onclick="roll()" class="w-full py-3 border border-purple-500 text-purple-400 hover:bg-purple-500/20 font-orbitron">ROLL DICE</button>
    </div>
    <script>
        let ms = 0, timer;
        function start() { if(!timer) timer = setInterval(() => { ms += 10; update(); }, 10); }
        function stop() { clearInterval(timer); timer = null; }
        function reset() { stop(); ms = 0; update(); }
        function update() { let s = Math.floor(ms/1000); let m = Math.floor(s/60); let cs = Math.floor((ms%1000)/10); document.getElementById('chrono').innerText = `${String(m).padStart(2,'0')}:${String(s%60).padStart(2,'0')}.${String(cs).padStart(2,'0')}`; }
        function roll() {
            const dice = document.getElementById('dice');
            const rand = Math.floor(Math.random() * 6);
            const rots = [[0,0], [0,-180], [-90,0], [90,0], [-90,90], [90,90]];
            dice.style.transform = `rotateX(${rots[rand][0]+720}deg) rotateY(${rots[rand][1]+720}deg)`;
        }
    </script>
</body>
</html>
